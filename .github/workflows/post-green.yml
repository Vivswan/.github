# Repo-owned: seeded once by the fleet sync, never overwritten by a later
# sync. Called after the all-green gate on every green push to main, before
# the release: REPLACE the no-op job with this repository's work (it uses a
# runner allocation per push until you do; the contract is in the fleet's
# docs/all-green.md, "After the gate"). Every green commit gets its own run
# and neighbouring runs overlap, so jobs here act on the repository's current
# state, never on "what this commit changed", stay idempotent, and never
# assume they run on the newest commit.
name: Post Green

on:
  workflow_call:
    inputs:
      sha:
        description: The green main commit the calling run judged.
        required: true
        type: string

jobs:
  noop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          SHA: ${{ inputs.sha }}
        run: echo "post-green hook for $SHA - nothing configured"
